name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          test "$tag" = "v${version}"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Check out the immutable release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
      - name: Verify the annotated tag and release metadata
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git cat-file -e "${TAG}^{tag}"
          test "$(git rev-parse "${TAG}^{commit}")" = "$(git rev-parse HEAD)"
          python -c 'import pathlib, tomllib; metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]; assert metadata["name"] == "morana"; assert metadata["version"] == __import__("os").environ["VERSION"]; assert metadata["requires-python"] == ">=3.12"'
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and inspect distributions
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist
          python -m twine check dist/*
          test -f "dist/morana-${VERSION}.tar.gz"
          test -f "dist/morana-${VERSION}-py3-none-any.whl"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          tar -tzf "dist/morana-${VERSION}.tar.gz"
          python -m zipfile -l "dist/morana-${VERSION}-py3-none-any.whl"
          sha256sum dist/*
      - name: Upload checked distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ steps.release.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release artifacts to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions-${{ needs.build.outputs.version }}
          path: dist/
      - name: Publish through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
