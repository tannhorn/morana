[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morana"
version = "0.1.0"
description = "Morana: modern reactor analysis for hexagonal lattices."
authors = [{name = "Lubomir Bures"}]
keywords = [
  "neutronics",
  "reactor-physics",
  "nuclear-engineering",
  "neutron-diffusion",
  "finite-volume",
  "hexagonal-lattice",
]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "plotly",
  "pyyaml",
  "pydantic",
  "h5py",
]

[project.optional-dependencies]
dev = [
  "black",
  "codespell>=2,<3",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9,<10",
  "mkdocstrings-python",
  "pylint",
  "pytest",
  "reuse",
  "vtk",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pylint.main]
py-version = "3.12"

[tool.pylint.format]
max-line-length = 88

[tool.pylint.messages_control]
disable = [
  "too-many-arguments",
  "too-many-locals",
  "too-few-public-methods",
]

[tool.pylint.basic]
good-names = ["D", "i", "j", "k", "q", "r"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
