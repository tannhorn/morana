<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">How an inactive shell addresses a local radial boundary face</title>
  <desc id="desc">A complete ring of inactive grey hexagons surrounds seven active blue hexagons. One shell cell and one of its shared faces are highlighted to show that the shell key and face direction together select a local Dirichlet boundary face.</desc>
  <style>
    .active { fill: #4c78a8; stroke: #1e3a5f; stroke-width: 1.6; }
    .shell { fill: #d9d9d9; stroke: #64748b; stroke-width: 1.6; }
    .selected-shell { fill: #aeb9c2; stroke: #334155; stroke-width: 2.5; }
    .selected-face { fill: none; stroke: #b42318; stroke-linecap: round; stroke-width: 5; }
    .other-face { fill: none; stroke: #d97706; stroke-dasharray: 5 4; stroke-linecap: round; stroke-width: 3; }
    .leader { fill: none; stroke: #64748b; stroke-width: 1.5; }
    .heading { font: 700 25px sans-serif; fill: #0f172a; }
    .label { font: 17px sans-serif; fill: #0f172a; }
    .code { font: 16px monospace; fill: #0f172a; }
    .small { font: 15px sans-serif; fill: #334155; }
  </style>
  <defs>
    <polygon id="hex" points="0,-40 34.64,-20 34.64,20 0,40 -34.64,20 -34.64,-20"/>
  </defs>

  <text class="heading" x="40" y="42">Inactive shell: local radial boundary addressing</text>
  <text class="small" x="40" y="68">One axial layer; the actual solve assigns a different excluded key to every grey cell.</text>

  <!-- Outer excluded shell, radius two. -->
  <g class="shell">
    <use href="#hex" transform="translate(210.72 160)"/>
    <use href="#hex" transform="translate(280 160)"/>
    <use href="#hex" transform="translate(349.28 160)"/>
    <use href="#hex" transform="translate(418.56 280)"/>
    <use href="#hex" transform="translate(383.92 340)"/>
    <use href="#hex" transform="translate(349.28 400)"/>
    <use href="#hex" transform="translate(280 400)"/>
    <use href="#hex" transform="translate(210.72 400)"/>
    <use href="#hex" transform="translate(176.08 340)"/>
    <use href="#hex" transform="translate(141.44 280)"/>
    <use href="#hex" transform="translate(176.08 220)"/>
  </g>
  <use class="selected-shell" href="#hex" transform="translate(383.92 220)"/>

  <!-- Complete active core, radius one. -->
  <g class="active">
    <use href="#hex" transform="translate(280 280)"/>
    <use href="#hex" transform="translate(245.36 220)"/>
    <use href="#hex" transform="translate(314.64 220)"/>
    <use href="#hex" transform="translate(349.28 280)"/>
    <use href="#hex" transform="translate(314.64 340)"/>
    <use href="#hex" transform="translate(245.36 340)"/>
    <use href="#hex" transform="translate(210.72 280)"/>
  </g>

  <!-- Shared faces of the selected shell cell. -->
  <line class="selected-face" x1="349.28" y1="200" x2="349.28" y2="240"/>
  <line class="other-face" x1="349.28" y1="240" x2="383.92" y2="260"/>
  <path class="leader" d="M383.92,190 L540,125"/>
  <path class="leader" d="M349.28,220 L540,238"/>
  <path class="leader" d="M366.6,250 L540,356"/>

  <text class="label" x="540" y="110">1. Identify the shell cell</text>
  <text class="code" x="565" y="138">key = "mms_shell_z4_p11"</text>
  <text class="small" x="540" y="165">It is unique within layer 4.</text>

  <text class="label" x="540" y="225">2. Choose a shared face</text>
  <text class="code" x="565" y="253">direction = "x+"</text>
  <text class="small" x="540" y="280">The red face receives the prescribed flux.</text>

  <text class="label" x="540" y="343">Why both are needed</text>
  <text class="small" x="540" y="370">It also touches another active cell.</text>
  <text class="code" x="565" y="394">direction = "u+"</text>
  <text class="small" x="540" y="420">selects the orange face.</text>

  <rect x="62" y="468" width="22" height="22" class="active"/>
  <text class="small" x="96" y="485">active MMS control volume: material, source, flux unknown, and balance contribution</text>
  <rect x="62" y="505" width="22" height="22" class="shell"/>
  <text class="small" x="96" y="522">inactive shell: topology only; no material, source, unknown, flux result, or balance contribution</text>
</svg>
