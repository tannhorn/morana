<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Full planar and slice-local active IDs</title>
  <desc id="desc">A material mesh over a full seven-cell planar lattice, showing excluded zero-material cells and compact active solver active IDs.</desc>
  <defs>
    <style>
      .hex { stroke: #111827; stroke-width: 2; }
      .text { font-family: Arial, sans-serif; fill: #111827; font-size: 15px; text-anchor: middle; dominant-baseline: middle; }
      .title { font-family: Arial, sans-serif; fill: #111827; font-size: 21px; font-weight: 700; }
      .note { font-family: Arial, sans-serif; fill: #374151; font-size: 16px; }
      .legend { stroke: #111827; stroke-width: 1.5; }
    </style>
  </defs>

  <text class="title" x="40" y="50">MaterialMesh: planar positions versus active solver cells</text>
  <rect class="legend" fill="#bfdbfe" x="42" y="78" width="28" height="20"/><text class="note" x="82" y="94">active material key</text>
  <rect class="legend" fill="#ffffff" x="240" y="78" width="28" height="20"/><text class="note" x="280" y="94">inactive excluded key "0"</text>

  <polygon class="hex" fill="#ffffff" points="489,235.2 446,210.3 403,235.2 403,284.8 446,309.7 489,284.8"/>
  <text class="text" x="446" y="249">planar 0</text><text class="text" x="446" y="271">active NaN</text>

  <polygon class="hex" fill="#bfdbfe" points="446,309.7 403,284.8 360,309.7 360,359.3 403,384.2 446,359.3"/>
  <text class="text" x="403" y="323.5">planar 1</text><text class="text" x="403" y="345.5">active 0</text>

  <polygon class="hex" fill="#ffffff" points="360,309.7 317,284.8 274,309.7 274,359.3 317,384.2 360,359.3"/>
  <text class="text" x="317" y="323.5">planar 2</text><text class="text" x="317" y="345.5">active NaN</text>

  <polygon class="hex" fill="#bfdbfe" points="317,235.2 274,210.3 231,235.2 231,284.8 274,309.7 317,284.8"/>
  <text class="text" x="274" y="249">planar 3</text><text class="text" x="274" y="271">active 1</text>

  <polygon class="hex" fill="#ffffff" points="360,160.7 317,135.8 274,160.7 274,210.3 317,235.2 360,210.3"/>
  <text class="text" x="317" y="174.5">planar 4</text><text class="text" x="317" y="196.5">active NaN</text>

  <polygon class="hex" fill="#bfdbfe" points="446,160.7 403,135.8 360,160.7 360,210.3 403,235.2 446,210.3"/>
  <text class="text" x="403" y="174.5">planar 5</text><text class="text" x="403" y="196.5">active 2</text>

  <polygon class="hex" fill="#bfdbfe" points="403,235.2 360,210.3 317,235.2 317,284.8 360,309.7 403,284.8"/>
  <text class="text" x="360" y="249">planar 6</text><text class="text" x="360" y="271">active 3</text>

  <text class="note" x="40" y="445">planar_id belongs to HexPlanarMesh and is defined for every 2D lattice position.</text>
  <text class="note" x="40" y="471">active_id is slice-local: it belongs to active cells at one axial_index.</text>
</svg>
