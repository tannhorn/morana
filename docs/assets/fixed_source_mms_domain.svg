<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Planar fixed-source manufactured-solution target hexagon</title>
  <desc id="desc">A regular planar hexagon of circumradius R with all six corner coordinates labelled.</desc>
  <style>
    .domain { fill: #dbeafe; stroke: #1e3a5f; stroke-width: 3; }
    .axis { fill: none; stroke: #64748b; stroke-width: 1.5; }
    .point { fill: #1e3a5f; }
    .heading { font: 700 27px sans-serif; fill: #0f172a; }
    .label { font: 18px sans-serif; fill: #0f172a; }
    .note { font: 16px sans-serif; fill: #334155; }
  </style>

  <text class="heading" x="450" y="48" text-anchor="middle">Planar target domain hex(R)</text>

  <polygon class="domain" points="625,270 537.5,118.4 362.5,118.4 275,270 362.5,421.6 537.5,421.6"/>

  <line class="axis" x1="155" y1="270" x2="745" y2="270"/>
  <path class="axis" d="M745,270 l-11,-6 M745,270 l-11,6"/>
  <line class="axis" x1="450" y1="465" x2="450" y2="82"/>
  <path class="axis" d="M450,82 l-6,11 M450,82 l6,11"/>
  <circle class="point" cx="450" cy="270" r="3.5"/>
  <text class="label" x="460" y="292">(0, 0)</text>
  <text class="label" x="760" y="277">x</text>
  <text class="label" x="458" y="90">y</text>

  <circle class="point" cx="625" cy="270" r="4"/>
  <circle class="point" cx="537.5" cy="118.4" r="4"/>
  <circle class="point" cx="362.5" cy="118.4" r="4"/>
  <circle class="point" cx="275" cy="270" r="4"/>
  <circle class="point" cx="362.5" cy="421.6" r="4"/>
  <circle class="point" cx="537.5" cy="421.6" r="4"/>

  <text class="label" x="642" y="263">(R, 0)</text>
  <text class="label" x="552" y="110">(R/2, √3R/2)</text>
  <text class="label" x="348" y="110" text-anchor="end">(−R/2, √3R/2)</text>
  <text class="label" x="258" y="263" text-anchor="end">(−R, 0)</text>
  <text class="label" x="348" y="454" text-anchor="end">(−R/2, −√3R/2)</text>
  <text class="label" x="552" y="454">(R/2, −√3R/2)</text>

  <text class="note" x="450" y="508" text-anchor="middle">a = 60 cm, R = 2a/√3; the three-dimensional domain is hex(R) × [0, H], with H = 108 cm.</text>
</svg>
